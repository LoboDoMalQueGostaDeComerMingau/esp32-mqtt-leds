<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 — Controle de LEDs</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

/* ===== SEU CSS ORIGINAL (SEM ALTERAÇÕES IMPORTANTES) ===== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0f;
  --surface: #16161a;
  --surface2: #1e1e24;
  --border: #2a2a32;
  --text: #e8e8f0;
  --text-muted: #6b6b80;
  --accent: #7c6af7;
  --on: #f0c040;
  --off: #2a2a32;
  --success: #3ddc84;
  --error: #ff5c5c;
  --warning: #f0c040;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 4rem;
  gap: 2rem;
}

/* (resto do seu CSS permanece igual — não mexi para não quebrar seu layout) */
</style>
</head>

<body>

<header>
  <h1>ESP32 LED Control</h1>
  <p>MQTT WebSocket Dashboard</p>
</header>

<!-- CONNECTION -->
<div class="conn-card">
  <div class="conn-row">
    <div class="conn-field">
      <label>Broker</label>
      <input id="broker" value="broker.emqx.io">
    </div>
    <div class="conn-field">
      <label>Porta WS</label>
      <input id="port" value="8084">
    </div>
  </div>

  <div class="conn-actions">
    <button class="btn btn-primary" onclick="connect()">Conectar</button>
    <button class="btn btn-secondary" onclick="disconnect()">Desconectar</button>
    <div class="status-dot" id="dot"></div>
    <span id="status-text">Desconectado</span>
  </div>
</div>

<!-- BULK -->
<div class="bulk-controls">
  <button class="btn btn-secondary" onclick="allOn()">Ligar todos</button>
  <button class="btn btn-secondary" onclick="allOff()">Desligar todos</button>
</div>

<!-- LEDs -->
<div class="led-grid" id="led-grid"></div>

<!-- LOG -->
<div class="log-card">
  <div class="log-title">Log</div>
  <div id="log"></div>
</div>

<script>

const LEDS = ['led1','led2','led3','led4','led5','led6'];
const state = {};
let client = null;

LEDS.forEach(id => state[id] = false);

/* ===== GRID ===== */
function buildGrid() {
  const grid = document.getElementById('led-grid');

  LEDS.forEach((id, i) => {
    const card = document.createElement('div');
    card.className = 'led-card';
    card.id = 'card-' + id;

    card.innerHTML = `
      <div class="led-bulb"></div>
      <div class="led-label">LED ${i+1}</div>
      <div class="toggle" id="toggle-${id}"></div>
      <div class="led-state" id="state-${id}">OFF</div>
    `;

    card.onclick = () => toggle(id);

    grid.appendChild(card);
  });
}

/* ===== TOGGLE ===== */
function toggle(id) {
  state[id] = !state[id];
  updateUI(id);
  publish(id, state[id] ? '1' : '0');
}

function updateUI(id) {
  const card = document.getElementById('card-' + id);
  const tog = document.getElementById('toggle-' + id);
  const st = document.getElementById('state-' + id);

  if(state[id]) {
    card.classList.add('on');
    tog.classList.add('on');
    st.textContent = 'ON';
  } else {
    card.classList.remove('on');
    tog.classList.remove('on');
    st.textContent = 'OFF';
  }
}

/* ===== MQTT ===== */
function connect() {

  if(client) client.end(true);

  const clientId = 'web_' + Math.random().toString(16).substr(2,8);

  client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
    clientId,
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 10000
  });

  setStatus('connecting');

  client.on('connect', () => {
    setStatus('connected');
    addLog('Conectado');

    LEDS.forEach(t => client.subscribe(t));
  });

  client.on('message', (topic, msg) => {
    const v = msg.toString();

    if(LEDS.includes(topic)) {
      state[topic] = v === '1';
      updateUI(topic);
    }
  });

  client.on('close', () => setStatus('disconnected'));
  client.on('error', (e) => addLog('Erro: ' + e.message));
}

/* ===== PUBLISH ===== */
function publish(topic, msg) {
  if(!client || !client.connected) return;
  client.publish(topic, msg);
}

/* ===== CONTROLES ===== */
function allOn() {
  LEDS.forEach(id => {
    state[id] = true;
    updateUI(id);
    publish(id, '1');
  });
}

function allOff() {
  LEDS.forEach(id => {
    state[id] = false;
    updateUI(id);
    publish(id, '0');
  });
}

function disconnect() {
  if(client) client.end();
  setStatus('disconnected');
}

/* ===== STATUS ===== */
function setStatus(s) {
  document.getElementById('status-text').textContent =
    s === 'connected' ? 'Conectado' :
    s === 'connecting' ? 'Conectando' :
    'Desconectado';
}

/* ===== LOG ===== */
function addLog(msg) {
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.textContent = msg;
  log.prepend(div);
}

/* ===== INIT ===== */
buildGrid();

</script>

</body>
</html>
